<!doctype html>

    <script>
      (function() {
        // Intercept Vite HMR WebSocket so it never throws "WebSocket closed without opened"
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const isVite = (protocols === 'vite-hmr') || 
                           (typeof protocols === 'string' && protocols.includes('vite')) ||
                           (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                           (typeof url === 'string' && url.includes('vite'));
            if (isVite) {
              const target = new EventTarget();
              const dummySocket = {
                url,
                protocols,
                readyState: 1, // WebSocket.OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              setTimeout(() => {
                const openEvent = new Event('open');
                if (typeof dummySocket.onopen === 'function') dummySocket.onopen(openEvent);
                target.dispatchEvent(openEvent);
              }, 10);
              return dummySocket;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (a && a.message) ? a.message : String(a)).join(' ');
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        const prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          const text = String(msg || '') + ' ' + String(error || '');
          if (text.includes('WebSocket') || text.includes('vite')) {
            return true; // suppresses the error
          }
          if (prevOnError) return prevOnError.apply(this, arguments);
          return false;
        };

        window.addEventListener('unhandledrejection', function(e) {
          const reason = (e && e.reason && e.reason.message) || String(e.reason || '');
          if (reason.includes('WebSocket') || reason.includes('vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          const msg = (e && e.message) || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
